global:
  scrape_interval: 5s

scrape_configs:
  - job_name: "app"
    static_configs:
      - targets: ["app:5000"]
  - job_name: "node"
    static_configs:
      - targets: ["node-exporter:9100"]
  - job_name: "postgres"
    static_configs:
      - targets: ["postgres-exporter:9187"]
  - job_name: "blackbox-http"
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets:
          - http://app:5000/
        labels:
          endpoint: "/"
      - targets:
          - http://app:5000/health
        labels:
          endpoint: "/health"
      - targets:
          - http://app:5000/slow
        labels:
          endpoint: "/slow"
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - source_labels: [endpoint]
        target_label: endpoint
      - target_label: __address__
        replacement: blackbox-exporter:9115